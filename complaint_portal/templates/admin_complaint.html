{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Complaint #{{ c.id }} — {{ c.subject }}</h2>
  <p><b>Student:</b> {{ c.name }} ({{ c.roll_no }}) · {{ c.email }}<br>
     <b>Category:</b> {{ c.category }} · <b>Submitted:</b> {{ c.created_at }}</p>
  <p>{{ c.description }}</p>
  <form method="post">
    <label>Status</label>
    <select name="status">
      {% for s in statuses %}<option {{ 'selected' if s==c.status }}>{{ s }}</option>{% endfor %}
    </select>
    <label>Reply to student</label>
    <textarea name="admin_reply">{{ c.admin_reply or '' }}</textarea>
    <button class="btn" type="submit">Update</button>
    <a class="btn" style="background:#6b7280" href="{{ url_for('admin_dashboard') }}">Back</a>
  </form>
</div>
{% endblock %}
